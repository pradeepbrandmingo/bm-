    <!-- DNS + TLS preconnect for fonts (eliminates the 117ms delay shown in Safari Network tab) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" />

    <!-- Non-blocking Google Fonts load (preload → swap to stylesheet after page paint) -->
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Beatrice&display=swap"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />

      <link href="https://fonts.googleapis.com/css2?family=Beatrice&display=swap" rel="stylesheet" />
    </noscript>

    <!-- Non-blocking Font Awesome CDN load -->
    <link
      rel="preload"

      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />

      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    </noscript>
